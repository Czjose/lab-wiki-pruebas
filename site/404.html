<!doctype html>
<html lang="es" data-raiz="/">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Página no encontrada · Glosario·QA</title>
  <meta name="robots" content="noindex">
  <!-- Rutas absolutas (/...): Nginx sirve esta página para cualquier URL que no exista,
       incluso /a/b/c, y una ruta relativa dejaría de encontrar el CSS. -->
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=JetBrains+Mono:wght@400;500&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&display=swap">
  <link rel="stylesheet" href="/assets/css/styles.css">
  <script>(function(){var t;try{t=localStorage.getItem("tema")}catch(e){}document.documentElement.dataset.theme=t||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light")})();</script>
</head>
<body>
  <header class="header">
    <div class="contenedor">
      <a class="logo" href="/" aria-label="Glosario·QA, inicio">
        <span class="logo-marca" aria-hidden="true"><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M11 6H7v20h4M21 6h4v20h-4"/><path d="M11.5 16.5l3.5 3.5 6-8"/></svg></span>
        Glosario<span class="logo-punto">·</span>QA
      </a>
      <nav class="nav-principal" id="menu-principal" aria-label="Principal">
        <a href="/">Glosario</a>
        <a href="/arquitectura.html">Arquitectura</a>
      </nav>
      <span class="header-sep" aria-hidden="true"></span>
      <div class="acciones">
        <a class="btn-buscar" href="/index.html#buscar" data-abrir-busqueda aria-label="Buscar término (atajo: barra /)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <span class="texto">Buscar término…</span><kbd>/</kbd>
        </a>
        <button class="btn-icono" type="button" data-tema aria-label="Cambiar tema">
          <svg class="icono-luna" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
          <svg class="icono-sol" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
        <button class="btn-icono btn-menu" type="button" aria-label="Abrir menú" aria-expanded="false" aria-controls="menu-principal">
          <svg class="icono-hamburguesa" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
          <svg class="icono-cerrar" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
        </button>
      </div>
    </div>
  </header>

  <main class="error-404">
    <div>
      <p class="codigo-error" aria-hidden="true">404</p>
      <p class="eyebrow">Resultado obtenido ≠ resultado esperado</p>
      <h1>Esta página no existe</h1>
      <p>El caso de prueba falló: pediste una dirección que el servidor no encontró. Puede que el enlace esté mal escrito o que la página se haya movido.</p>
      <a class="boton" href="/">Volver al glosario</a>
    </div>
  </main>

  <script src="/assets/js/terminos.js"></script>
  <script src="/assets/js/config.js"></script>
  <script src="/assets/js/app.js"></script>
</body>
</html>
