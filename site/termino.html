<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- El título real lo pone app.js según el término (?id=...) -->
  <title>Término · Glosario·QA</title>
  <meta name="description" content="Definición, ejemplo práctico, ventajas y desventajas de un término del glosario de pruebas de software.">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=JetBrains+Mono:wght@400;500&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&display=swap">
  <link rel="stylesheet" href="assets/css/styles.css">
  <script>(function(){var t;try{t=localStorage.getItem("tema")}catch(e){}document.documentElement.dataset.theme=t||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light")})();</script>
</head>
<body>
  <a class="salto" href="#contenido">Saltar al contenido</a>
  <div class="progreso" aria-hidden="true"></div>

  <header class="header">
    <div class="contenedor">
      <a class="logo" href="index.html" aria-label="Glosario·QA, inicio">
        <span class="logo-marca" aria-hidden="true"><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M11 6H7v20h4M21 6h4v20h-4"/><path d="M11.5 16.5l3.5 3.5 6-8"/></svg></span>
        Glosario<span class="logo-punto">·</span>QA
      </a>
      <nav class="nav-principal" id="menu-principal" aria-label="Principal">
        <a href="index.html" aria-current="page">Glosario</a>
        <a href="arquitectura.html">Arquitectura</a>
      </nav>
      <span class="header-sep" aria-hidden="true"></span>
      <div class="acciones">
        <a class="btn-buscar" href="index.html#buscar" data-abrir-busqueda aria-label="Buscar término (atajo: barra /)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <span class="texto">Buscar término…</span><kbd>/</kbd>
        </a>
        <button class="btn-icono" type="button" data-tema aria-label="Cambiar tema">
          <svg class="icono-luna" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
          <svg class="icono-sol" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
        <button class="btn-icono btn-menu" type="button" aria-label="Abrir menú" aria-expanded="false" aria-controls="menu-principal">
          <svg class="icono-hamburguesa" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
          <svg class="icono-cerrar" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
        </button>
      </div>
    </div>
  </header>
  <div class="velo" hidden></div>

  <!-- Layout de 3 columnas: navegación · artículo · índice de la página -->
  <div class="contenedor doc">
    <aside class="lateral lateral-izq" id="lateral-izq" aria-label="Términos del glosario">
      <label class="sr-only" for="filtro-nav">Filtrar términos</label>
      <input class="filtro-nav" id="filtro-nav" type="search" placeholder="Filtrar términos…" autocomplete="off">
      <nav class="nav-terminos" id="nav-terminos" aria-label="Lista de términos"></nav>
    </aside>

    <main id="contenido">
      <details class="toc-movil">
        <summary>En esta página</summary>
        <ul class="toc" id="toc-movil"></ul>
      </details>
      <article class="articulo" id="articulo">
        <noscript><h1>Se necesita JavaScript</h1><p>Esta página arma el contenido a partir de los datos del glosario. Activa JavaScript o vuelve a la <a href="index.html">portada</a>.</p></noscript>
      </article>
    </main>

    <aside class="lateral lateral-der" aria-label="En esta página">
      <p class="cat lateral-titulo">En esta página</p>
      <nav aria-label="Secciones del término"><ul class="toc" id="toc"></ul></nav>
      <button class="btn-copiar-enlace" id="copiar-enlace" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/></svg>
        Copiar enlace
      </button>
    </aside>
  </div>

  <footer class="footer">
    <div class="contenedor">
      <p class="autor"><span class="logo-marca" aria-hidden="true"><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M11 6H7v20h4M21 6h4v20h-4"/><path d="M11.5 16.5l3.5 3.5 6-8"/></svg></span>Jose Cruz · Ingeniería de Software Aplicada III · UTP, FISC</p>
      <p class="estado-servidor" data-estado><span class="punto" aria-hidden="true"></span><span class="texto-estado">Servido con Nginx en Docker</span></p>
    </div>
  </footer>

  <script src="assets/js/terminos.js"></script>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
