server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Si el archivo no existe, responde 404 (en lugar de listar carpetas o redirigir)
    location / {
        try_files $uri $uri/ =404;
    }

    # Página 404 con el estilo del sitio
    error_page 404 /404.html;

    # config.js y las imágenes personalizables se editan a mano: "no-cache" obliga al
    # navegador a revisar si cambiaron, así basta con refrescar para ver el cambio.
    # ("=" y "^~" tienen prioridad sobre la regla de caché de abajo.)
    location = /assets/js/config.js {
        add_header Cache-Control "no-cache";
    }
    location ^~ /assets/img/ {
        add_header Cache-Control "no-cache";
    }

    # Los recursos estáticos cambian poco: el navegador puede guardarlos 7 días
    location ~* \.(css|js|svg|png|jpg|woff2)$ {
        expires 7d;
        add_header Cache-Control "public";
    }
}
